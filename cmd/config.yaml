server_type: "development"           # TODO
service_port: "8080"
technical_port: "9200"

storage:
  type: "postgres"                 # TODO
  version: "18-alpine"
  container_name: "db"
  connection:
    driver: "postgres"
    host: "localhost"
    port: "5432"
    database: "avito_shop"
  query_timeout: "5s"

logger:                              # TODO
  type: "zap_logging"
  level: "info"

tools:
  json: "sonic"

security:
  hash:
    cost: 10
  jwt_token:
    lifetime: "24h"
    prefix: "Bearer"



