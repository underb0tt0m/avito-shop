services:
  app:
    container_name: app
    build:
      context: ..
      dockerfile: cmd/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ../logs:/root/logs
      - ../.env:/root/.env
      - ./config.yaml:/root/config.yaml
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  db:
    image: postgres:18-alpine
    container_name: db
    command: -c max_connections=350 # TODO конфиг
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: avito_shop
    ports:
      - "5431:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

  migrations:
    image: migrate/migrate:v4.19.1
    container_name: migrations
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgresql://postgres:postgres@db:5432/avito_shop?sslmode=disable"
      - "up"
    volumes:
      - ../internal/storage/postgres/migrations:/migrations
    depends_on:
      db:
        condition: service_healthy
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_started
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafanadata:/var/lib/grafana

volumes:
  postgres_data:
  grafanadata:
